<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1400" preserveAspectRatio="xMidYMid slice">
  <!--
    The phone's own light. A landscape pool cover-cropped into a 390px frame
    falls off the edge, so this is re-authored in a portrait aspect rather than
    nudged with background-position.

    Built from the same five named parts as the landscape asset, because a
    single wide radial is an ambient tint and not a lamp:

      1. pool     the light lying ON the ground: hard-squashed and set low,
                  with a radius tight enough to have a visible edge.
      2. contact  the ground darkening under and behind the pool.
      3. head     the lamp itself, a small genuinely hot core at the near edge
                  of the pool where the fitting sits.
      4. throw    the wedge running up and away, masked to die before the top.
      5. house    a much weaker second source falling from high on the far side.

    Copper rather than a signal colour: the light reads as a work lamp on a
    driveway, the colour of the tooling, not of a hazard.
  -->
  <defs>
    <radialGradient id="poolP" cx="0.6" cy="0.645" r="0.5"
                    gradientTransform="matrix(1 0 0 0.3 0 0.4515)">
      <stop offset="0" stop-color="#fff2e2" stop-opacity="0.46"/>
      <stop offset="0.1" stop-color="#f8c893" stop-opacity="0.4"/>
      <stop offset="0.24" stop-color="#eda863" stop-opacity="0.28"/>
      <stop offset="0.42" stop-color="#c98146" stop-opacity="0.15"/>
      <stop offset="0.63" stop-color="#8f5a2a" stop-opacity="0.06"/>
      <stop offset="0.82" stop-color="#74401c" stop-opacity="0.022"/>
      <stop offset="1" stop-color="#291710" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="contactP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#000000" stop-opacity="0.04"/>
      <stop offset="0.79" stop-color="#000000" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.6"/>
    </linearGradient>

    <radialGradient id="headP" cx="0.655" cy="0.612" r="0.1"
                    gradientTransform="matrix(1 0 0 0.52 0 0.29376)">
      <stop offset="0" stop-color="#fff6ea" stop-opacity="0.6"/>
      <stop offset="0.28" stop-color="#ffdcb6" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#e3a468" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#a35a26" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="throwFadeP" x1="1" y1="1" x2="0.2" y2="0.15">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="throwMaskP">
      <rect width="800" height="1400" fill="url(#throwFadeP)"/>
    </mask>
    <linearGradient id="throwP" x1="0.9" y1="0.86" x2="0.05" y2="0.28">
      <stop offset="0" stop-color="#ffb98c" stop-opacity="0.3"/>
      <stop offset="0.4" stop-color="#a35a26" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#a35a26" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="houseP" cx="0.1" cy="0.05" r="0.55">
      <stop offset="0" stop-color="#efe6dc" stop-opacity="0.085"/>
      <stop offset="0.4" stop-color="#8a7161" stop-opacity="0.032"/>
      <stop offset="1" stop-color="#191512" stop-opacity="0"/>
    </radialGradient>

    <filter id="grainP" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.07"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="1400" fill="#100e0c"/>
  <rect width="800" height="1400" fill="url(#houseP)"/>
  <rect width="800" height="1400" fill="url(#contactP)"/>
  <rect width="800" height="1400" fill="url(#throwP)" mask="url(#throwMaskP)"/>
  <rect width="800" height="1400" fill="url(#poolP)"/>
  <rect width="800" height="1400" fill="url(#headP)"/>
  <rect width="800" height="1400" filter="url(#grainP)" opacity="0.55"/>
</svg>
