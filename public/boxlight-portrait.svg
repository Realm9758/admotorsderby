<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1400" preserveAspectRatio="xMidYMid slice" role="presentation" aria-hidden="true">
  <defs>
    <radialGradient id="pool" cx="0.48" cy="0.80" r="0.72" gradientTransform="translate(0 0.552) scale(1 0.31)">
      <stop offset="0" stop-color="#ffd8a2" stop-opacity="0.30"/>
      <stop offset="0.28" stop-color="#f6bb7c" stop-opacity="0.17"/>
      <stop offset="0.55" stop-color="#c07d45" stop-opacity="0.075"/>
      <stop offset="0.78" stop-color="#6d4527" stop-opacity="0.028"/>
      <stop offset="1" stop-color="#2b1a10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="contact" x1="0" y1="0.55" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#000000" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.60"/>
    </linearGradient>
    <radialGradient id="head" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffeccb" stop-opacity="0.56"/>
      <stop offset="0.42" stop-color="#ffcf8e" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#c98a45" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="throwFade" x1="0.3" y1="1" x2="0.55" y2="0.1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="0.85" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="throwMask"><rect width="780" height="1400" fill="url(#throwFade)"/></mask>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6a52" stop-opacity="0.30"/>
      <stop offset="0.3" stop-color="#c9301f" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#5c1109" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sky" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1d2b3a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0d1116" stop-opacity="0"/>
    </radialGradient>
      <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
