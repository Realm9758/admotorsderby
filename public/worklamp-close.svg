<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice">
  <!--
    The same work light behind the closing phone number, turned down and
    moved to the middle of the frame.

    A separate asset rather than the hero asset shifted with
    background-position, because a shifted pool drifts off centre at every
    width while a pool authored centred stays put. Same stops, same grain,
    lower ceiling: this one sits behind a phone number and must never compete
    with it.
  -->
  <defs>
    <radialGradient id="lampClose" cx="0.5" cy="0.6" r="0.56">
      <stop offset="0" stop-color="#ffeedd" stop-opacity="0.3"/>
      <stop offset="0.08" stop-color="#f6cfa0" stop-opacity="0.22"/>
      <stop offset="0.2" stop-color="#f0a86e" stop-opacity="0.14"/>
      <stop offset="0.35" stop-color="#d1743a" stop-opacity="0.085"/>
      <stop offset="0.53" stop-color="#a35a26" stop-opacity="0.048"/>
      <stop offset="0.74" stop-color="#74401c" stop-opacity="0.019"/>
      <stop offset="1" stop-color="#291710" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="floorClose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.28"/>
    </linearGradient>

    <filter id="grainClose" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.055"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="700" fill="#100e0c"/>
  <rect width="1600" height="700" fill="url(#lampClose)"/>
  <rect width="1600" height="700" fill="url(#floorClose)"/>
  <rect width="1600" height="700" filter="url(#grainClose)" opacity="0.55"/>
</svg>
