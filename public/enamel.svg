<svg xmlns="http://www.w3.org/2000/svg" width="170" height="170" viewBox="0 0 170 170">
  <!-- Vitreous enamel is fired glass on steel: it has a fine speckle and it
       chips. This tile carries the speckle; the specular sweep and the chips
       are drawn in CSS on the surfaces that use it. -->
  <defs>
    <filter id="speck" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.62" numOctaves="4" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.55" intercept="0"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="170" height="170" filter="url(#speck)"/>
</svg>
