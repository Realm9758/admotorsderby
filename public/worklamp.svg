<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!--
    The hero's light source, produced as an asset rather than assembled from
    flat CSS ramps. No photograph of this business exists and stock imagery
    was refused, so the first viewport is lit instead of shot.

    A callout that answers any hour reads as a work light stood on a driveway
    at night, low and to the right, throwing up and across, with a much
    weaker domestic wash falling from high on the far side.

    Built in five parts, because a single radial gradient is a smudge and not
    a lamp however carefully its stops are tuned:

      1. pool     the light lying ON the ground. A hard-squashed ellipse low
                  in the frame, not a circle at mid-height.
      2. contact  the ground darkening under and behind the pool.
      3. head     the lamp itself: a small, genuinely hot core at the near
                  edge of the pool, where the fitting would be sitting.
      4. throw    the wedge running up and away across the frame, masked so
                  it dies before the top edge.
      5. house    a much weaker domestic wash falling from high on the far
                  side, so the scene has more than one source.

    Copper rather than a signal colour: the light reads as a work lamp on a
    driveway, the colour of the tooling, not of a hazard. Grain is baked in over the
    top, both to kill banding across a wide dark gradient and to give the
    light something to sit in.
  -->
  <defs>
    <radialGradient id="pool" cx="0.7" cy="0.82" r="0.62"
                    gradientTransform="matrix(1 0 0 0.3 0 0.574)">
      <stop offset="0" stop-color="#ffeeda" stop-opacity="0.34"/>
      <stop offset="0.12" stop-color="#f8c893" stop-opacity="0.3"/>
      <stop offset="0.28" stop-color="#e59a55" stop-opacity="0.22"/>
      <stop offset="0.46" stop-color="#d1743a" stop-opacity="0.12"/>
      <stop offset="0.68" stop-color="#74401c" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#291710" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="contact" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#000000" stop-opacity="0.05"/>
      <stop offset="0.86" stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.62"/>
    </linearGradient>

    <radialGradient id="head" cx="0.795" cy="0.775" r="0.1"
                    gradientTransform="matrix(1 0 0 0.62 0 0.294)">
      <stop offset="0" stop-color="#fff1df" stop-opacity="0.5"/>
      <stop offset="0.3" stop-color="#ffdcb6" stop-opacity="0.3"/>
      <stop offset="0.62" stop-color="#f2c39f" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#b87a3a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="throwFade" x1="1" y1="1" x2="0.15" y2="0.05">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.38" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="throwMask">
      <rect width="1600" height="1000" fill="url(#throwFade)"/>
    </mask>
    <linearGradient id="throw" x1="0.95" y1="0.85" x2="0.1" y2="0.15">
      <stop offset="0" stop-color="#ffb98c" stop-opacity="0.2"/>
      <stop offset="0.4" stop-color="#a35a26" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#a35a26" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="house" cx="0.12" cy="0.06" r="0.5">
      <stop offset="0" stop-color="#efe6dc" stop-opacity="0.1"/>
      <stop offset="0.4" stop-color="#8a7161" stop-opacity="0.038"/>
      <stop offset="1" stop-color="#191512" stop-opacity="0"/>
    </radialGradient>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.07"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#100e0c"/>
  <rect width="1600" height="1000" fill="url(#house)"/>
  <rect width="1600" height="1000" fill="url(#contact)"/>
  <rect width="1600" height="1000" fill="url(#throw)" mask="url(#throwMask)"/>
  <rect width="1600" height="1000" fill="url(#pool)"/>
  <rect width="1600" height="1000" fill="url(#head)"/>
  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.55"/>
</svg>
