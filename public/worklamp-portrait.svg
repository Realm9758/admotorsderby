<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1400" preserveAspectRatio="xMidYMid slice">
  <!--
    The same work light, reframed for a phone.

    The landscape asset puts the lamp at 70% across a 16:10 frame. Cover-crop
    a 390-wide portrait viewport out of that and the pool falls off the right
    edge and reads as a smear. Re-authored in the phone's own aspect instead:
    same stops, same grain, lamp still low and right, but low and right of a
    tall frame. Mobile is this page's real design target, not a breakpoint to
    survive, so this asset carries more light than the landscape one and its
    pool sits lower and further in — a visitor outdoors on a phone next to a
    car that won't start.
  -->
  <defs>
    <radialGradient id="lampP" cx="0.63" cy="0.79" r="0.78"
                    gradientTransform="matrix(1 0 0 0.6 0 0.316)">
      <stop offset="0" stop-color="#ffeeda" stop-opacity="0.4"/>
      <stop offset="0.05" stop-color="#f8c893" stop-opacity="0.42"/>
      <stop offset="0.13" stop-color="#eda863" stop-opacity="0.4"/>
      <stop offset="0.26" stop-color="#c98146" stop-opacity="0.3"/>
      <stop offset="0.43" stop-color="#8f5a2a" stop-opacity="0.18"/>
      <stop offset="0.67" stop-color="#74401c" stop-opacity="0.075"/>
      <stop offset="1" stop-color="#291710" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="throwFadeP" x1="1" y1="1" x2="0.2" y2="0.15">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="throwMaskP">
      <rect width="800" height="1400" fill="url(#throwFadeP)"/>
    </mask>
    <linearGradient id="throwP" x1="1" y1="1" x2="0" y2="0.3">
      <stop offset="0" stop-color="#ffb98c" stop-opacity="0.28"/>
      <stop offset="0.4" stop-color="#a35a26" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#a35a26" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="houseP" cx="0.1" cy="0.05" r="0.55">
      <stop offset="0" stop-color="#efe6dc" stop-opacity="0.1"/>
      <stop offset="0.4" stop-color="#8a7161" stop-opacity="0.038"/>
      <stop offset="1" stop-color="#191512" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="floorP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.66" stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.42"/>
    </linearGradient>

    <filter id="grainP" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.07"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="1400" fill="#100e0c"/>
  <rect width="800" height="1400" fill="url(#houseP)"/>
  <rect width="800" height="1400" fill="url(#throwP)" mask="url(#throwMaskP)"/>
  <rect width="800" height="1400" fill="url(#lampP)"/>
  <rect width="800" height="1400" fill="url(#floorP)"/>
  <rect width="800" height="1400" filter="url(#grainP)" opacity="0.55"/>
</svg>
