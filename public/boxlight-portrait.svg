    </filter>
  </defs>
  <rect width="780" height="1400" fill="#0e1014"/>
  <ellipse cx="560" cy="210" rx="520" ry="520" fill="url(#sky)"/>
  <g mask="url(#throwMask)">
    <polygon points="300,860 430,850 690,1400 40,1400" fill="#ffcb8c" opacity="0.05" filter="url(#soft)"/>
  </g>
  <rect width="780" height="1400" fill="url(#pool)"/>
  <ellipse cx="368" cy="866" rx="176" ry="120" fill="url(#head)"/>
  <ellipse cx="676" cy="600" rx="150" ry="150" fill="url(#lamp)"/>
  <rect width="780" height="1400" fill="url(#contact)"/>
